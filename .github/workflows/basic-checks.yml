name: Basic repository checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  basic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for sensitive paths
        run: |
          if git ls-files | grep -E '(^|/)(\.env|secrets\.yaml|transcripts|recordings|private)(/|$)' | grep -v '^\.env\.example$'; then
            echo 'Potential sensitive path committed'; exit 1
          fi
          echo 'Basic path check passed; this is not a secrets scanner.'
